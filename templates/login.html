{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Access your wallet</h2>
    <form method="post">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {{ form.username.label }}
            {{ form.username(class_='input') }}
        </div>
        <div class="form-group">
            {{ form.password.label }}
            {{ form.password(class_='input') }}
        </div>
        <div class="form-group">
            <label class="inline-label">{{ form.remember_me() }} Remember me</label>
        </div>
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
